<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0;">

  <img src="foto.jpg" style="width:100vw;height:100vh;object-fit:contain;display:block;background:black;">

  <audio id="audio" loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById("audio");

    // intenta sonar apenas carga
    audio.play().catch(() => {
      // si el navegador lo bloquea, suena al primer click
      document.addEventListener("click", () => {
        audio.play();
      }, { once: true });
    });
  </script>

</body>
</html>
