<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0; overflow:hidden; background:black;">

  <div id="intro" style="
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    user-select:none;
    background:black;
    transition:opacity 0.8s ease;
  ">

    <img id="ojo" src="ojo_cerrado.png" style="
      width:750px;
      max-width:90vw;
      height:auto;
      display:block;
      cursor:pointer;
    " onerror="this.style.display='none'; document.getElementById('fallback').style.display='block';">

    <div id="fallback" style="
      display:none;
      color:white;
      font-family:'Times New Roman', Times, serif;
      font-size:22px;
      opacity:0.7;
    ">
      (No se encontró el ojo_cerrado.png)
    </div>

    <div id="texto" style="
      margin-top:-10px;
      font-family:'Times New Roman', Times, serif;
      font-size:26px;
      color:white;
      opacity:0;
      transition:opacity 0.2s ease;
      pointer-events:none;
    ">wake up</div>

  </div>

  <img id="fotoFinal" src="foto.jpg" style="
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity 1s ease;
  ">

  <audio id="audio" loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <script>
    const intro = document.getElementById("intro");
    const fotoFinal = document.getElementById("fotoFinal");
    const audio = document.getElementById("audio");

    const ojo = document.getElementById("ojo");
    const texto = document.getElementById("texto");

    ojo.addEventListener("mouseenter", () => {
      ojo.src = "ojo_abierto.png";
      texto.style.opacity = "1";
    });

    ojo.addEventListener("mouseleave", () => {
      ojo.src = "ojo_cerrado.png";
      texto.style.opacity = "0";
    });

    intro.addEventListener("click", () => {
      audio.play();

      intro.style.opacity = "0";
      fotoFinal.style.opacity = "1";

      setTimeout(() => {
        intro.style.display = "none";
      }, 900);
    });
  </script>

</body>
</html>
