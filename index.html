<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0; overflow:hidden; background:black;">

  <!-- Imagen final (oculta al inicio) -->
  <img id="fotoFinal" src="foto.jpg" style="
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:contain;
    display:block;
    opacity:0;
    transition:opacity 1s ease;
    background:black;
  ">

  <!-- Intro: ojo en el centro -->
  <div id="intro" style="
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    user-select:none;
    cursor:pointer;
    background:black;
    transition:opacity 0.8s ease;
  ">

    <!-- Ojo -->
    <img id="ojo" src="ojo_cerrado.png" style="
      width:160px;
      height:auto;
      display:block;
    ">

    <!-- Texto -->
    <div id="texto" style="
      margin-top:14px;
      font-family:'Times New Roman', Times, serif;
      font-size:20px;
      color:white;
      opacity:0;
      transition:opacity 0.2s ease;
    ">wake up</div>

  </div>

  <!-- Música -->
  <audio id="audio" loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <script>
    const intro = document.getElementById("intro");
    const fotoFinal = document.getElementById("fotoFinal");
    const audio = document.getElementById("audio");

    const ojo = document.getElementById("ojo");
    const texto = document.getElementById("texto");

    // Hover: ojo abierto + mostrar texto
    intro.addEventListener("mouseenter", () => {
      ojo.src = "ojo_abierto.png";
      texto.style.opacity = "1";
    });

    // Sale el mouse: ojo cerrado + ocultar texto
    intro.addEventListener("mouseleave", () => {
      ojo.src = "ojo_cerrado.png";
      texto.style.opacity = "0";
    });

    // Click: reproducir música + transición a imagen final
    intro.addEventListener("click", () => {
      audio.play();

      intro.style.opacity = "0";
      fotoFinal.style.opacity = "1";

      setTimeout(() => {
        intro.style.display = "none";
      }, 900);
    });
  </script>

</body>
</html>
