<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0; overflow:hidden; background:black;">

  <!-- Fondo relleno -->
  <div id="fondo" style="
    position:fixed;
    inset:0;
    background-image:url('foto.jpg');
    background-size:cover;
    background-position:center;
    filter:brightness(0.6);
    opacity:0;
    transition:opacity 1s ease;
    z-index:1;
  "></div>

  <!-- Imagen final COMPLETA -->
  <img id="fotoFinal" src="foto.jpg" style="
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:contain;
    display:block;
    opacity:0;
    transition:opacity 1s ease;
    z-index:2;
  ">

  <!-- Intro: ojo en el centro -->
  <div id="intro" style="
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    user-select:none;
